uid: TEST-0005
type: test
status: ratified
title: Verification is reported per branch, and a branch settled only by inspection
  or checked on one kind alone is flagged
text: Given a project declaring how each requirement is verified, the report groups
  the distribution by grounding branch and not by item. A branch whose requirements
  are all settled by human inspection is flagged. A branch holding requirements of
  two kinds whose automated checks all sit on one kind is flagged naming the unchecked
  kind, even though every requirement in the branch is covered by the per-item rule.
  A branch with an automated check on each kind is not flagged. A project declaring
  no verification attribute produces no report and says why.
